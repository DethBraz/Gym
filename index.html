<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Diário de treino: rotinas, séries, timer de descanso e progresso.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <title>Gym — Diário de Treino</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main" class="wrap"></main>

  <div id="rest" class="rest" hidden>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 48 48"><circle class="ring-bg" cx="24" cy="24" r="20"/><circle id="rest-ring" class="ring-fg" cx="24" cy="24" r="20" pathLength="100"/></svg>
    </div>
    <div class="grow">
      <small>Descanso</small>
      <strong id="rest-time">0:00</strong>
    </div>
    <div class="rest-btns">
      <button class="btn sm soft" data-a="rest-add" data-s="-15">−15</button>
      <button class="btn sm soft" data-a="rest-add" data-s="15">+15</button>
      <button class="icon" id="rest-skip" data-a="rest-skip" aria-label="Pular descanso"></button>
    </div>
  </div>

  <nav id="nav" class="nav" aria-label="Navegação principal"></nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
